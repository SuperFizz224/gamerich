<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#10b981;--b:#059669}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">Snake 🐍</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Skor</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">Panjang</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">Level</div><div class="val" id="s3">0</div></div></div>
<canvas id="c" width="300" height="300"></canvas>
<div class="dpad"><div></div><button class="btn" id="bu">▲</button><div></div><button class="btn" id="bl">◀</button><button class="btn" id="bd">▼</button><button class="btn" id="br">▶</button></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_snake')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_snake',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var N=15,C=20,cv=$('c'),x=cv.getContext('2d'),sn,dir,nd,food,score,dead,iv,best=gb(),spd;
function reset(){sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir=nd={x:1,y:0};score=0;dead=false;spd=140;place();clearInterval(iv);iv=setInterval(step,spd);S(1,0);S(2,3);S(3,1);$('best').textContent=best;msg('Geser layar atau pakai tombol arah');draw()}
function place(){do{food={x:rnd(N),y:rnd(N)}}while(sn.some(function(p){return p.x==food.x&&p.y==food.y}))}
function step(){dir=nd;var h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(function(p){return p.x==h.x&&p.y==h.y})){dead=true;clearInterval(iv);if(score>best){best=score;sb(best)}$('best').textContent=best;draw();return}
 sn.unshift(h);if(h.x==food.x&&h.y==food.y){score++;place();S(1,score);S(3,1+Math.floor(score/5));if(spd>70&&score%5==0){spd-=10;clearInterval(iv);iv=setInterval(step,spd)}}else sn.pop();S(2,sn.length);draw()}
function draw(){x.fillStyle='#08130e';x.fillRect(0,0,300,300);x.fillStyle='#ef4444';x.beginPath();x.arc(food.x*C+10,food.y*C+10,7,0,7);x.fill();
 sn.forEach(function(p,i){x.fillStyle=i?'#10b981':'#6ee7b7';x.fillRect(p.x*C+1,p.y*C+1,C-2,C-2)});
 if(dead){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,300,300);x.fillStyle='#fff';x.textAlign='center';x.font='bold 24px sans-serif';x.fillText('GAME OVER',150,140);x.font='13px sans-serif';x.fillText('Ketuk layar untuk main lagi',150,168)}}
function turn(dx,dy){if(dx==-dir.x&&dy==-dir.y)return;nd={x:dx,y:dy}}
function go(d){if(d=='tap'){if(dead)reset();return}if(d=='u')turn(0,-1);if(d=='d')turn(0,1);if(d=='l')turn(-1,0);if(d=='r')turn(1,0)}
swipe(cv,go);tap($('bu'),function(){go('u')});tap($('bd'),function(){go('d')});tap($('bl'),function(){go('l')});tap($('br'),function(){go('r')});
document.addEventListener('keydown',function(e){var m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(m[e.key]){e.preventDefault();go(m[e.key])}});
reset();

})();
</script>
</body>
</html>
