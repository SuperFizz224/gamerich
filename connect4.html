<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#ef4444;--b:#b91c1c}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">Connect 4 🔴</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Kamu</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">Seri</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">AI</div><div class="val" id="s3">0</div></div></div>
<div id="bd" class="grid" style="grid-template-columns:repeat(7,1fr);max-width:320px;gap:4px;background:#1d4ed8;padding:6px;border-radius:12px"></div><div class="controls"><button class="btn" id="nw">🔄 Ronde Baru</button></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_connect4')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_connect4',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var b,over,busy,sc={1:0,0:0,2:0},bd=$('bd');
function wins(b,p){for(var r=0;r<6;r++)for(var c=0;c<7;c++){if(b[r*7+c]!=p)continue;var D=[[0,1],[1,0],[1,1],[1,-1]];for(var d=0;d<4;d++){var k=1;while(k<4){var rr=r+D[d][0]*k,cc=c+D[d][1]*k;if(rr<0||rr>5||cc<0||cc>6||b[rr*7+cc]!=p)break;k++}if(k==4)return true}}return false}
function row(b,c){for(var r=5;r>=0;r--)if(!b[r*7+c])return r;return -1}
function full(b){for(var c=0;c<7;c++)if(!b[c])return false;return true}
function ev(b){var s=0;for(var r=0;r<6;r++)for(var c=0;c<7;c++){var v=b[r*7+c];if(v==2)s+=3-Math.abs(3-c);else if(v==1)s-=3-Math.abs(3-c)}return s}
function mm(b,d,al,be,mx){if(wins(b,2))return 1000+d;if(wins(b,1))return -1000-d;if(d==0||full(b))return ev(b);var O=[3,2,4,1,5,0,6],best=mx?-1e9:1e9;
 for(var i=0;i<7;i++){var c=O[i],r=row(b,c);if(r<0)continue;b[r*7+c]=mx?2:1;var v=mm(b,d-1,al,be,!mx);b[r*7+c]=0;if(mx){if(v>best)best=v;if(best>al)al=best}else{if(v<best)best=v;if(best<be)be=best}if(al>=be)break}return best}
function ai(){var bc=3,bv=-1e9,O=[3,2,4,1,5,0,6];for(var i=0;i<7;i++){var c=O[i],r=row(b,c);if(r<0)continue;b[r*7+c]=2;var v=mm(b,4,-1e9,1e9,false);b[r*7+c]=0;if(v>bv){bv=v;bc=c}}return bc}
function draw(){bd.innerHTML='';for(var i=0;i<42;i++){var d=document.createElement('div');d.style.cssText='aspect-ratio:1;border-radius:50%;background:'+(b[i]==1?'#ef4444':b[i]==2?'#fbbf24':'#0b0f17');(function(c){tap(d,function(){play(c)})})(i%7);bd.appendChild(d)}S(1,sc[1]);S(2,sc[0]);S(3,sc[2]);$('best').textContent=sc[1]}
function end(w){over=true;if(w){sc[w]++;msg(w==1?'🏆 Kamu menang!':'🤖 AI menang!')}else{sc[0]++;msg('Seri!')}draw()}
function play(c){if(over||busy)return;var r=row(b,c);if(r<0)return;b[r*7+c]=1;draw();if(wins(b,1)){end(1);return}if(full(b)){end(0);return}busy=true;msg('AI berpikir...');
 setTimeout(function(){var a=ai(),rr=row(b,a);b[rr*7+a]=2;busy=false;msg('Giliranmu (merah)');draw();if(wins(b,2))end(2);else if(full(b))end(0)},350)}
function init(){b=[];for(var i=0;i<42;i++)b.push(0);over=false;busy=false;msg('Ketuk kolom untuk menjatuhkan disk merah');draw()}
tap($('nw'),init);init();

})();
</script>
</body>
</html>
