<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#10b981;--b:#047857}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">Tebak Kata 🔤</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Tebakan</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">Menang</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">Streak</div><div class="val" id="s3">0</div></div></div>
<div id="bd" class="grid" style="grid-template-columns:repeat(5,1fr);max-width:260px;gap:5px"></div><div id="kb" style="margin-top:10px"></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_wordle')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_wordle',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var W='BUNGA RUMAH MALAM SAYUR KURSI PANAS KAPAL HUTAN TANAH ANGIN BULAN BUKIT PAPAN JALAN KOTAK BATAS DAPUR GELAS PISAU TEMAN KELAS BUAYA PINTU TIDUR MAKAN MINUM SUSAH LAMPU KERJA BELUM SAKIT MURAH BESAR KECIL PUTIH HITAM HIJAU MERAH SAWAH'.split(' ').filter(function(w){return w.length==5});
var ans,row,col,gs,cs,keys,over,wins=gb(),streak=0,bd=$('bd'),kb=$('kb'),RW=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
var KC={g:'#16a34a',y:'#ca8a04',x:'#374151'};
function init(){ans=W[rnd(W.length)];row=0;col=0;over=false;gs=[];cs=[];keys={};for(var i=0;i<6;i++){gs.push(['','','','','']);cs.push(null)}draw();$('best').textContent=wins;S(1,'0/6');S(2,wins);S(3,streak);msg('Tebak kata 5 huruf bahasa Indonesia')}
function draw(){bd.innerHTML='';for(var r=0;r<6;r++)for(var c=0;c<5;c++){var d=document.createElement('div');var k=cs[r]?cs[r][c]:'';d.style.cssText='aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;border-radius:6px;border:2px solid '+(gs[r][c]&&!k?'#94a3b8':'#334155')+';background:'+(k?KC[k]:'#0f172a');d.textContent=gs[r][c];bd.appendChild(d)}
 kb.innerHTML='';RW.forEach(function(rw,ri){var line=document.createElement('div');line.style.cssText='display:flex;gap:4px;justify-content:center;margin-bottom:5px';if(ri==2)line.appendChild(key('ENTER',1));rw.split('').forEach(function(ch){line.appendChild(key(ch))});if(ri==2)line.appendChild(key('⌫',1));kb.appendChild(line)})}
function key(k,w){var b=document.createElement('button');b.textContent=k;b.style.cssText='flex:'+(w?'1.6':'1')+';padding:11px 0;border:none;border-radius:6px;font-weight:800;font-size:'+(w?11:14)+'px;color:#fff;background:'+(KC[keys[k]]||'#475569');tap(b,function(){press(k)});return b}
function press(k){if(over)return;if(k=='⌫'){if(col>0){col--;gs[row][col]='';draw()}return}
 if(k=='ENTER'){if(col<5){msg('Huruf belum lengkap');return}check();return}if(col<5){gs[row][col]=k;col++;draw()}}
function check(){var g=gs[row].join(''),res=['x','x','x','x','x'],pool={};
 for(var i=0;i<5;i++){if(g[i]==ans[i])res[i]='g';else pool[ans[i]]=(pool[ans[i]]||0)+1}
 for(i=0;i<5;i++){if(res[i]!='g'&&pool[g[i]]>0){res[i]='y';pool[g[i]]--}}
 cs[row]=res;for(i=0;i<5;i++){var cur=keys[g[i]],n=res[i];if(!cur||(cur=='x'&&n!='x')||(cur=='y'&&n=='g'))keys[g[i]]=n}
 row++;col=0;S(1,row+'/6');msg('');
 if(g==ans){over=true;wins++;streak++;sb(wins);S(2,wins);S(3,streak);$('best').textContent=wins;msg('🏆 Benar! Tekan ENTER untuk kata baru')}
 else if(row==6){over=true;streak=0;S(3,0);msg('Kalah. Jawabannya: '+ans+' — tekan ENTER')}
 draw();if(over){var old=press;press=function(k){if(k=='ENTER'){press=old;init()}}}}
init();

})();
</script>
</body>
</html>
