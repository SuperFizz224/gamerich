<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#f59e0b;--b:#d97706}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">2048 🔢</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Skor</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">Tile Max</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">Langkah</div><div class="val" id="s3">0</div></div></div>
<div id="bd" class="grid" style="grid-template-columns:repeat(4,1fr);width:100%;max-width:320px;background:#0f172a;padding:8px;border-radius:12px;touch-action:none"></div>
<div class="dpad"><div></div><button class="btn" id="bu">▲</button><div></div><button class="btn" id="bl">◀</button><button class="btn" id="bd2">▼</button><button class="btn" id="br">▶</button></div>
<div class="controls"><button class="btn alt" id="nw">🔄 Game Baru</button></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_2048')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_2048',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var COL={0:'#1e293b',2:'#475569',4:'#64748b',8:'#f59e0b',16:'#f97316',32:'#ef4444',64:'#dc2626',128:'#eab308',256:'#84cc16',512:'#10b981',1024:'#06b6d4',2048:'#8b5cf6'};
var g,score,mv,over,best=gb(),bd=$('bd');
function init(){g=[];for(var i=0;i<16;i++)g.push(0);score=0;mv=0;over=false;add();add();draw();$('best').textContent=best;msg('Geser untuk menggabungkan angka yang sama')}
function add(){var e=[];g.forEach(function(v,i){if(!v)e.push(i)});if(e.length)g[e[rnd(e.length)]]=Math.random()<.9?2:4}
function line(a){var r=a.filter(Boolean),o=[];for(var i=0;i<r.length;i++){if(r[i]==r[i+1]){o.push(r[i]*2);score+=r[i]*2;i++}else o.push(r[i])}while(o.length<4)o.push(0);return o}
function can(){for(var i=0;i<16;i++){if(!g[i])return true;if(i%4<3&&g[i]==g[i+1])return true;if(i<12&&g[i]==g[i+4])return true}return false}
function move(d){if(over)return;var old=g.join(),i,j,a,idx;
 for(i=0;i<4;i++){a=[];for(j=0;j<4;j++){idx=d<2?i*4+j:j*4+i;a.push(g[idx])}if(d%2)a.reverse();a=line(a);if(d%2)a.reverse();for(j=0;j<4;j++){idx=d<2?i*4+j:j*4+i;g[idx]=a[j]}}
 if(g.join()!=old){mv++;add();if(score>best){best=score;sb(best);$('best').textContent=best}if(!can()){over=true;msg('Game over! Skor '+score)}}draw()}
function draw(){bd.innerHTML='';g.forEach(function(v){var c=document.createElement('div');c.style.cssText='aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:'+(v>=1024?18:v>=128?22:26)+'px;background:'+(COL[v]||'#a855f7')+';color:'+(v<=4&&v?'#e2e8f0':'#fff');c.textContent=v||'';bd.appendChild(c)});
 S(1,score);S(2,Math.max.apply(null,g));S(3,mv)}
swipe(bd,function(d){var m={l:0,r:1,u:2,d:3};if(d in m)move(m[d])});
tap($('bl'),function(){move(0)});tap($('br'),function(){move(1)});tap($('bu'),function(){move(2)});tap($('bd2'),function(){move(3)});tap($('nw'),init);
document.addEventListener('keydown',function(e){var m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3};if(e.key in m){e.preventDefault();move(m[e.key])}});
init();

})();
</script>
</body>
</html>
