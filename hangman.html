<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#ec4899;--b:#be185d}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">Hangman 🪢</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Nyawa</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">Menang</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">Streak</div><div class="val" id="s3">0</div></div></div>
<canvas id="c" width="160" height="130" style="width:160px"></canvas><div id="wd" style="text-align:center;font-size:26px;font-weight:900;letter-spacing:6px;margin:10px 0 4px;min-height:36px"></div><div id="kb" class="grid" style="grid-template-columns:repeat(9,1fr);gap:4px;max-width:340px"></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_hangman')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_hangman',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var L={HEWAN:'KUCING HARIMAU KELINCI BURUNG GAJAH JERAPAH KAMBING KERBAU'.split(' '),BUAH:'SEMANGKA JERUK MANGGA NANGKA DURIAN PISANG RAMBUTAN ANGGUR'.split(' '),KOTA:'SURABAYA JAKARTA BANDUNG MEDAN MAKASSAR SEMARANG MALANG PALEMBANG'.split(' '),NEGARA:'INDONESIA JEPANG BRASIL MESIR KANADA AUSTRALIA THAILAND'.split(' ')};
var cv=$('c'),x=cv.getContext('2d'),word,cat,used,wrong,over,wins=gb(),streak=0,kb=$('kb');
function init(){var ks=Object.keys(L);cat=ks[rnd(4)];word=L[cat][rnd(L[cat].length)];used={};wrong=0;over=false;msg('Kategori: '+cat);draw()}
function draw(){x.clearRect(0,0,160,130);x.strokeStyle='#94a3b8';x.lineWidth=3;x.beginPath();x.moveTo(10,125);x.lineTo(90,125);x.moveTo(30,125);x.lineTo(30,10);x.lineTo(95,10);x.lineTo(95,25);x.stroke();x.strokeStyle='#f472b6';
 var P=[function(){x.beginPath();x.arc(95,35,10,0,7);x.stroke()},function(){x.beginPath();x.moveTo(95,45);x.lineTo(95,80);x.stroke()},function(){x.beginPath();x.moveTo(95,52);x.lineTo(80,68);x.stroke()},function(){x.beginPath();x.moveTo(95,52);x.lineTo(110,68);x.stroke()},function(){x.beginPath();x.moveTo(95,80);x.lineTo(82,102);x.stroke()},function(){x.beginPath();x.moveTo(95,80);x.lineTo(108,102);x.stroke()}];
 for(var i=0;i<wrong;i++)P[i]();
 $('wd').textContent=word.split('').map(function(c){return used[c]||over&&wrong>=6?c:'_'}).join(' ');
 kb.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(k){var b=document.createElement('button');b.textContent=k;b.style.cssText='padding:9px 0;border:none;border-radius:6px;font-weight:800;font-size:14px;color:#fff;background:'+(used[k]?(word.indexOf(k)>=0?'#16a34a':'#7f1d1d'):'#475569');tap(b,function(){guess(k)});kb.appendChild(b)});
 S(1,6-wrong);S(2,wins);S(3,streak);$('best').textContent=wins}
function guess(k){if(over){init();return}if(used[k])return;used[k]=true;if(word.indexOf(k)<0)wrong++;
 if(word.split('').every(function(c){return used[c]})){over=true;wins++;streak++;sb(wins);msg('🏆 Benar! Ketuk huruf apa saja untuk kata baru')}
 else if(wrong>=6){over=true;streak=0;msg('Kalah! Jawabannya '+word+' — ketuk huruf untuk lanjut')}draw()}
init();

})();
</script>
</body>
</html>
