<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>:root{--a:#22c55e;--b:#15803d}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box;margin:0;padding:0}
html{background:#0b0f17;min-height:100%}
body{background:#0b0f17;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation;overflow-x:hidden}
.wrapper{width:100%;max-width:480px;margin:auto;padding:12px}
.card{background:linear-gradient(180deg,rgba(15,18,26,.97),rgba(10,12,18,.97));border:2px solid var(--a);border-radius:20px;box-shadow:0 14px 44px rgba(0,0,0,.75),inset 0 0 40px rgba(255,255,255,.03);padding:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.title{font-size:10px;letter-spacing:1.5px;color:var(--a);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.title .dot{width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bb{font-size:10px;color:#94a3b8;text-align:right}.bb b{color:#fff;font-size:14px}
.stat-row{display:flex;gap:8px;margin-bottom:8px}
.stat-pill{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:5px 8px;text-align:center}
.lbl{font-size:8px;letter-spacing:1px;color:#64748b;text-transform:uppercase;font-weight:700}
.val{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
canvas{display:block;margin:0 auto;max-width:100%;height:auto;border-radius:12px;border:2px solid #1e293b;background:#070a12;touch-action:none}
#msg{text-align:center;margin-top:8px;font-size:12px;color:rgba(255,255,255,.55);min-height:16px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:8px;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btn{padding:13px 6px;font-size:15px;font-weight:800;border:none;border-radius:12px;cursor:pointer;color:#fff;text-align:center;background:linear-gradient(135deg,var(--a),var(--b))}
.btn:active{transform:scale(.94);filter:brightness(.9)}
.btn.alt{background:linear-gradient(135deg,#475569,#334155)}
.grid{display:grid;gap:6px;margin:0 auto}
.credit-bar{margin-top:10px;text-align:center;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
.credit-bar span{color:var(--a)}
</style>
<body>
<div class="wrapper"><div class="card">
<div class="header"><div><div class="title"><span class="dot"></span>RuthlessImperium</div><h2 style="font-size:17px;font-weight:900;margin-top:2px">Reversi ⚫</h2></div><div class="bb">BEST<br><b id="best">0</b></div></div>
<div class="stat-row"><div class="stat-pill"><div class="lbl">Kamu ⚫</div><div class="val" id="s1">0</div></div><div class="stat-pill"><div class="lbl">AI ⚪</div><div class="val" id="s2">0</div></div><div class="stat-pill"><div class="lbl">Menang</div><div class="val" id="s3">0</div></div></div>
<div id="bd" class="grid" style="grid-template-columns:repeat(8,1fr);max-width:320px;gap:2px;background:#052e16;padding:4px;border-radius:10px"></div><div class="controls"><button class="btn" id="nw">🔄 Ronde Baru</button></div>
<div id="msg"></div>
<div class="credit-bar">Engineered by <span>RuthlessImperium</span> ⚡</div>
</div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function S(i,v){$('s'+i).textContent=v}
function tap(el,fn){el.addEventListener('pointerdown',function(e){e.preventDefault();fn(e)})}
function msg(t){$('msg').textContent=t}
function gb(){try{return parseInt(localStorage.getItem('ri_reversi')||'0',10)||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('ri_reversi',String(v))}catch(e){}}
function rnd(n){return Math.floor(Math.random()*n)}
function swipe(el,fn){var sx,sy;el.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});el.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){fn('tap');return}if(Math.abs(dx)>Math.abs(dy))fn(dx>0?'r':'l');else fn(dy>0?'d':'u')})}

var B,turn,over,busy,wins=gb(),bd=$('bd'),WT=[];
for(var i=0;i<64;i++){var r=Math.floor(i/8),c=i%8,e=(r==0||r==7),f=(c==0||c==7);WT.push(e&&f?100:(e||f)?10:((r==1||r==6||c==1||c==6)?-3:1))}
WT[1]=WT[8]=WT[6]=WT[15]=WT[48]=WT[57]=WT[55]=WT[62]=-20;
function flips(b,r,c,p){if(b[r*8+c])return[];var o=3-p,res=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var ln=[],rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==o){ln.push(rr*8+cc);rr+=dr;cc+=dc}if(ln.length&&rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==p)res=res.concat(ln)}return res}
function moves(b,p){var m=[];for(var i=0;i<64;i++){var f=flips(b,Math.floor(i/8),i%8,p);if(f.length)m.push({i:i,f:f})}return m}
function cnt(p){return B.filter(function(v){return v==p}).length}
function init(){B=new Array(64).fill(0);B[27]=B[36]=2;B[28]=B[35]=1;turn=1;over=false;busy=false;msg('Giliranmu (hitam)');draw()}
function draw(){bd.innerHTML='';var mv=(turn==1&&!over)?moves(B,1).map(function(m){return m.i}):[];B.forEach(function(v,i){var d=document.createElement('div');d.style.cssText='aspect-ratio:1;background:#15803d;display:flex;align-items:center;justify-content:center';
 if(v)d.innerHTML='<div style="width:78%;height:78%;border-radius:50%;background:'+(v==1?'#111':'#f1f5f9')+';box-shadow:0 2px 4px rgba(0,0,0,.6)"></div>';else if(mv.indexOf(i)>=0)d.innerHTML='<div style="width:24%;height:24%;border-radius:50%;background:rgba(255,255,255,.35)"></div>';
 tap(d,function(){press(i)});bd.appendChild(d)});S(1,cnt(1));S(2,cnt(2));S(3,wins);$('best').textContent=wins}
function apply(m,p){B[m.i]=p;m.f.forEach(function(i){B[i]=p})}
function press(i){if(over||busy||turn!=1)return;var m=moves(B,1).filter(function(x){return x.i==i})[0];if(!m)return;apply(m,1);turn=2;draw();after()}
function after(){var pm=moves(B,1).length,am=moves(B,2).length;
 if(!pm&&!am){over=true;var a=cnt(1),b=cnt(2);if(a>b){wins++;sb(wins)}msg(a>b?'🏆 Kamu menang '+a+'–'+b:a<b?'🤖 AI menang '+b+'–'+a:'Seri!');draw();return}
 if(turn==2){if(!am){turn=1;msg('AI tidak punya langkah, giliranmu lagi');draw();return}busy=true;msg('AI berpikir...');setTimeout(function(){var ms=moves(B,2).sort(function(a,b){return (WT[b.i]*3+b.f.length)-(WT[a.i]*3+a.f.length)});apply(ms[0],2);busy=false;turn=1;msg('Giliranmu (hitam)');draw();after()},500)}
 else if(!pm){turn=2;msg('Kamu tidak punya langkah, giliran AI');draw();after()}}
tap($('nw'),init);init();

})();
</script>
</body>
</html>
